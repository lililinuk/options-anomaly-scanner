services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: options_scanner
      POSTGRES_USER: options_scanner
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - options_scanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U options_scanner -d options_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  options_scanner_pgdata:

