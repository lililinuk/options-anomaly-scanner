name: Nightwatch OI Change Rollover Timing Experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run never contacts Nightwatch; live still obeys the hard date guard"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - live

permissions:
  contents: read
  actions: read

concurrency:
  group: oi-change-rollover-timing-experiment
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NIGHTWATCH_API_KEY: ${{ secrets.NIGHTWATCH_API_KEY }}
      PROBE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      OUTPUT_DIR: research-output
      PRIOR_DIR: ../.oi-change-rollover-prior
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run isolated probe or date-guarded no-op
        run: >-
          python -m app.research.oi_change_rollover probe
          --mode "${PROBE_MODE}"
          --output-dir "${OUTPUT_DIR}"

      - name: Download prior safe experiment artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          mkdir -p "${PRIOR_DIR}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | startswith(\"oi-change-rollover-probe-\")) and .workflow_run.head_branch == \"${DEFAULT_BRANCH}\") | .id" \
            | while read -r artifact_id; do
                artifact_dir="${PRIOR_DIR}/${artifact_id}"
                mkdir -p "${artifact_dir}"
                gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                  > "${artifact_dir}/artifact.zip"
                unzip -q "${artifact_dir}/artifact.zip" -d "${artifact_dir}/contents"
                rm "${artifact_dir}/artifact.zip"
              done

      - name: Build cumulative safe summaries
        if: always()
        run: >-
          python -m app.research.oi_change_rollover aggregate
          --output-dir "${OUTPUT_DIR}"
          --current "${OUTPUT_DIR}/probe_results.json"
          --prior-root "${PRIOR_DIR}"

      - name: Publish human-readable run summary
        if: always()
        shell: bash
        run: |
          cat "${OUTPUT_DIR}/step_summary.md" >> "${GITHUB_STEP_SUMMARY}"
          printf '\n' >> "${GITHUB_STEP_SUMMARY}"
          cat "${OUTPUT_DIR}/oi_change_rollover_summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify artifacts contain no configured secret
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secret = os.getenv("NIGHTWATCH_API_KEY")
          if secret:
              for path in Path("research-output").glob("*"):
                  if path.is_file() and secret in path.read_text(encoding="utf-8"):
                      raise SystemExit("SECRET_SAFETY_CHECK_FAILED")
          print("secret_safety_check=passed")
          PY

      - name: Upload safe probe and cumulative artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oi-change-rollover-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/research-output/probe_results.json
            backend/research-output/probe_results.csv
            backend/research-output/oi_change_rollover_cumulative.csv
            backend/research-output/oi_change_rollover_summary.md
          if-no-files-found: error
          retention-days: 45
