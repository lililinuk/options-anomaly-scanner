name: Phase 2A Daily Archive

on:
  schedule:
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "Activity is session-gated; Radar/OI is manual pending rollover evidence"
        required: true
        default: activity
        type: choice
        options:
          - activity
          - radar-oi

permissions:
  contents: read

concurrency:
  group: phase2a-daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NIGHTWATCH_API_KEY: ${{ secrets.NIGHTWATCH_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate required configuration
        shell: bash
        run: |
          missing=()
          if [[ -z "${DATABASE_URL:-}" ]]; then
            missing+=("DATABASE_URL")
          fi
          if [[ -z "${NIGHTWATCH_API_KEY:-}" ]]; then
            missing+=("NIGHTWATCH_API_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            for name in "${missing[@]}"; do
              echo "CONFIGURATION_ERROR: required secret/environment variable ${name} is not configured"
            done
            exit 2
          fi

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Capture scheduled canonical session-complete Activity
        if: github.event_name == 'schedule'
        run: python -m app.cli archive-mag7-daily --mode activity --scheduled

      - name: Run explicitly selected manual collection mode
        if: github.event_name == 'workflow_dispatch'
        run: python -m app.cli archive-mag7-daily --mode "${{ inputs.mode }}"
